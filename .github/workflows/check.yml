name: Check shared Cortex content
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/sync-cortex-session-start.sh --check
      - run: bash scripts/sync-cortex-skills.sh --check
